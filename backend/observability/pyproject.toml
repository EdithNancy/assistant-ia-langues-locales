[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-observability"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
    "opentelemetry-instrumentation-httpx>=0.49b0,<1",
    "opentelemetry-instrumentation-logging>=0.49b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0,<1",
    "prometheus-client>=0.21,<1",
]

[tool.setuptools]
packages = ["backend_observability"]
