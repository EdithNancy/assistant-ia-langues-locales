    <!-- Thème appliqué avant l'affichage : pas de flash clair en mode sombre -->
    <style>
      html[data-theme='dark'] { background: #0e1415; color-scheme: dark; }
    </style>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('ivoirai.preferences') || '{}').theme || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
