
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ia-langues-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ia_langues}:${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans .env}@postgres:5432/${POSTGRES_DB:-ia_langues_locales}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./migrations:/app/migrations
      - audio_data:/app/storage/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ia-langues-network

  postgres:
    image: postgres:16-alpine
    container_name: ia-langues-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ia_langues_locales}
      POSTGRES_USER: ${POSTGRES_USER:-ia_langues}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ia-langues-network

  redis:
    image: redis:7-alpine
    container_name: ia-langues-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ia-langues-network

volumes:
  postgres_data:
  redis_data:
  audio_data:

networks:
  ia-langues-network:
    driver: bridge
