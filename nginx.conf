server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support du routage React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression des fichiers texte (réseaux mobiles lents)
    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Le service worker doit toujours être revalidé pour que les mises à jour arrivent
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Mise en cache des assets statiques pour optimiser les performances
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sécurité basique
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}